
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Found Items | Lost & Found</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            color: #252525;
            background: white;
        }

        /* Header */

        header {
            border-bottom: 2px solid #555;
            padding: 18px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
        }

        .logo {
            font-weight: bold;
            font-size: 18px;
        }

        nav {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }

        nav a {
            text-decoration: none;
            color: #333;
            font-size: 13px;
        }

        nav a.active {
            font-weight: bold;
            border-bottom: 2px solid #333;
            padding-bottom: 7px;
        }

        /* Main layout */

        .container {
            max-width: 1150px;
            margin: auto;
            padding: 45px 20px 80px;
            min-height: 80vh;
        }

        .page-heading p {
            font-size: 11px;
            letter-spacing: 2px;
            color: #777;
        }

        .page-heading h1 {
            font-size: 36px;
            margin: 10px 0;
        }

        .heading-line {
            width: 45%;
            height: 8px;
            background: #e5e5e5;
            margin-bottom: 25px;
        }

        .found-layout {
            display: grid;
            grid-template-columns: 250px minmax(0, 1fr);
            gap: 30px;
        }

        /* Filters */

        .filters {
            border: 1px solid #999;
            padding: 18px;
            align-self: start;
        }

        .filter-heading {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .filter-heading h2 {
            font-size: 18px;
        }

        .filter-heading button {
            background: none;
            border: none;
            text-decoration: underline;
            cursor: pointer;
        }

        .filters h3 {
            margin-top: 22px;
            font-size: 14px;
        }

        .category-option {
            display: flex;
            gap: 8px;
            align-items: center;
            margin: 12px 0;
            font-size: 14px;
        }

        .filters > label {
            display: block;
            margin: 20px 0 8px;
            font-size: 14px;
            font-weight: bold;
        }

        .filters select,
        .filters input[type="date"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #999;
            background: white;
        }

        .apply-button {
            width: 100%;
            margin-top: 20px;
            padding: 12px;
            background: #252525;
            color: white;
            border: none;
            cursor: pointer;
        }

        /* Search and sorting */

        .search-row {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .search-row input {
            flex: 1;
            min-width: 0;
            padding: 12px;
            border: 1px solid #aaa;
        }

        .search-row label {
            white-space: nowrap;
            font-size: 13px;
        }

        .search-row select {
            padding: 12px;
            border: 1px solid #aaa;
            background: white;
        }

        #itemCount {
            font-size: 13px;
            color: #777;
            margin: 15px 0;
        }

        /* Item cards */

        .items-grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 18px;
        }

        .item-card {
            border: 1px solid #aaa;
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        .item-image {
            width: 100%;
            height: 155px;
            object-fit: cover;
            background: #eee;
            border-bottom: 1px solid #aaa;
        }

        .item-placeholder {
            display: flex;
            justify-content: center;
            align-items: center;
            color: #888;
            font-size: 13px;
        }

        .item-details {
            padding: 12px;
            display: flex;
            flex-direction: column;
            flex: 1;
        }

        .item-category {
            font-size: 11px;
            color: #777;
            text-transform: uppercase;
        }

        .item-details h3 {
            font-size: 16px;
            margin: 7px 0;
        }

        .item-details p {
            font-size: 13px;
            margin: 3px 0;
            overflow-wrap: anywhere;
        }

        .claim-button {
            display: block;
            text-align: center;
            text-decoration: none;
            border: 1px solid #333;
            padding: 10px;
            margin-top: 12px;
            color: #222;
            font-size: 13px;
            font-weight: bold;
        }

        .claim-button:hover {
            background: #252525;
            color: white;
        }

        /* Pagination */

        .pagination {
            display: flex;
            justify-content: center;
            gap: 6px;
            margin: 25px 0;
        }

        .pagination button {
            padding: 10px 14px;
            border: 1px solid #aaa;
            background: white;
            cursor: pointer;
        }

        .pagination button.active {
            background: #252525;
            color: white;
        }

        .pagination button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        /* Report banner */

        .report-banner {
            border: 2px dashed #bbb;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
        }

        .report-banner p {
            font-size: 14px;
        }

        .report-banner a {
            padding: 12px;
            border: 1px solid #333;
            color: #222;
            text-decoration: none;
            font-size: 13px;
            font-weight: bold;
        }

        .report-banner a:hover {
            background: #252525;
            color: white;
        }

        /* Footer */

        footer {
            border-top: 1px solid #777;
            background: #f5f5f5;
            padding: 25px 5%;
            display: flex;
            justify-content: space-between;
            gap: 15px;
            font-size: 12px;
        }

        footer a {
            color: #444;
            margin-left: 15px;
        }

        /* Responsive layout */

        @media (max-width: 850px) {
            .found-layout {
                grid-template-columns: 1fr;
            }

            .items-grid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }

            header {
                flex-direction: column;
            }
        }

        @media (max-width: 550px) {
            .items-grid {
                grid-template-columns: 1fr;
            }

            .search-row {
                flex-wrap: wrap;
            }

            .search-row input {
                flex-basis: 100%;
            }

            .report-banner {
                flex-direction: column;
                align-items: stretch;
            }

            footer {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

    <!-- Header -->
    <header>
        <div class="logo">Lost & Found</div>

        <nav>
            <a href="index.html">Home</a>
            <a href="report.html">Report Lost Item</a>
            <a href="found.html" class="active">Found Items</a>
            <a href="instructions.html">How to Claim</a>
        </nav>
    </header>

    <!-- Main content -->
    <main class="container">

        <div class="page-heading">
            <p>PAGE TITLE</p>
            <h1>Found items</h1>
            <div class="heading-line"></div>
        </div>

        <div class="found-layout">

            <!-- Filters -->
            <aside class="filters">

                <div class="filter-heading">
                    <h2>Filters</h2>
                    <button id="clearFilters" type="button">
                        Clear all
                    </button>
                </div>

                <h3>Category</h3>

                <div id="categoryFilters"></div>

                <label for="locationFilter">
                    Location found
                </label>

                <select id="locationFilter">
                    <option value="">Any location</option>
                </select>

                <label for="dateAfter">Found after</label>
                <input type="date" id="dateAfter">

                <label for="dateBefore">Found before</label>
                <input type="date" id="dateBefore">

                <button id="applyFilters"
                        class="apply-button"
                        type="button">
                    Apply filters
                </button>

            </aside>

            <!-- Results -->
            <section class="results">

                <div class="search-row">

                    <input
                        type="search"
                        id="searchInput"
                        placeholder="Search found items"
                        aria-label="Search found items"
                    >

                    <label for="sortSelect">Sort by</label>

                    <select id="sortSelect">
                        <option value="newest">Newest first</option>
                        <option value="oldest">Oldest first</option>
                        <option value="az">Name A-Z</option>
                        <option value="za">Name Z-A</option>
                    </select>

                </div>

                <p id="itemCount" aria-live="polite">
                    Loading items...
                </p>

                <div id="itemsGrid" class="items-grid"></div>

                <div id="pagination" class="pagination"></div>

                <div class="report-banner">
                    <p>Don't see your item?</p>
                    <a href="report.html">
                        Report a lost item
                    </a>
                </div>

            </section>

        </div>
    </main>

    <!-- Footer -->
    <footer>
        <span>&copy; 2026 Lost & Found</span>

        <div>
            <a href="instructions.html">Contact</a>
            <a href="instructions.html">FAQ</a>
            <a href="instructions.html">Claim policy</a>
        </div>
    </footer>

    <!-- JavaScript -->
    <script>
        const itemsGrid = document.getElementById("itemsGrid");
        const itemCount = document.getElementById("itemCount");
        const pagination = document.getElementById("pagination");

        const searchInput = document.getElementById("searchInput");
        const sortSelect = document.getElementById("sortSelect");
        const locationFilter = document.getElementById("locationFilter");
        const dateAfter = document.getElementById("dateAfter");
        const dateBefore = document.getElementById("dateBefore");
        const categoryFilters = document.getElementById("categoryFilters");

        let allItems = [];
        let filteredItems = [];
        let currentPage = 1;

        const itemsPerPage = 6;

        // Load data from items.json
        async function loadItems() {
            try {
                const response = await fetch("items.json");

                if (!response.ok) {
                    throw new Error("Could not load items.json");
                }

                const data = await response.json();

                allItems = Array.isArray(data) ? data : data.items;

                if (!Array.isArray(allItems)) {
                    throw new Error("Invalid items.json format");
                }

                setupFilters();
                applyFilters();

            } catch (error) {
                console.error(error);
                itemCount.textContent = "Unable to load found items.";
            }
        }

        // Set up category and location filters
        function setupFilters() {
            const categories = [...new Set(
                allItems.map(item => item.category).filter(Boolean)
            )].sort();

            categories.forEach(category => {
                const label = document.createElement("label");
                label.className = "category-option";

                const checkbox = document.createElement("input");
                checkbox.type = "checkbox";
                checkbox.value = category;
                checkbox.name = "category";

                label.append(
                    checkbox,
                    document.createTextNode(category)
                );

                categoryFilters.appendChild(label);
            });

            const locations = [...new Set(
                allItems.map(item => item.location).filter(Boolean)
            )].sort();

            locations.forEach(location => {
                const option = document.createElement("option");
                option.value = location;
                option.textContent = location;
                locationFilter.appendChild(option);
            });
        }

        // Apply search, filters and sorting
        function applyFilters() {
            const search = searchInput.value.toLowerCase().trim();

            const selectedCategories = [
                ...categoryFilters.querySelectorAll("input:checked")
            ].map(checkbox => checkbox.value);

            filteredItems = allItems.filter(item => {
                const name = String(item.name || "");
                const location = String(item.location || "");
                const category = String(item.category || "");
                const date = String(item.dateFound || "");

                const matchesSearch =
                    name.toLowerCase().includes(search) ||
                    location.toLowerCase().includes(search) ||
                    category.toLowerCase().includes(search);

                const matchesCategory =
                    selectedCategories.length === 0 ||
                    selectedCategories.includes(category);

                const matchesLocation =
                    !locationFilter.value ||
                    location === locationFilter.value;

                const matchesAfter =
                    !dateAfter.value ||
                    date >= dateAfter.value;

                const matchesBefore =
                    !dateBefore.value ||
                    date <= dateBefore.value;

                return matchesSearch &&
                       matchesCategory &&
                       matchesLocation &&
                       matchesAfter &&
                       matchesBefore;
            });

            switch (sortSelect.value) {
                case "newest":
                    filteredItems.sort((a, b) =>
                        String(b.dateFound || "").localeCompare(
                            String(a.dateFound || "")
                        )
                    );
                    break;

                case "oldest":
                    filteredItems.sort((a, b) =>
                        String(a.dateFound || "").localeCompare(
                            String(b.dateFound || "")
                        )
                    );
                    break;

                case "az":
                    filteredItems.sort((a, b) =>
                        String(a.name || "").localeCompare(
                            String(b.name || "")
                        )
                    );
                    break;

                case "za":
                    filteredItems.sort((a, b) =>
                        String(b.name || "").localeCompare(
                            String(a.name || "")
                        )
                    );
                    break;
            }

            currentPage = 1;
            displayItems();
        }

        // Create item cards
        function displayItems() {
            itemsGrid.innerHTML = "";

            itemCount.textContent =
                `Showing ${filteredItems.length} items`;

            const start = (currentPage - 1) * itemsPerPage;

            const pageItems = filteredItems.slice(
                start,
                start + itemsPerPage
            );

            if (pageItems.length === 0) {
                itemsGrid.textContent = "No matching items found.";
            }

            pageItems.forEach(item => {
                const card = document.createElement("article");
                card.className = "item-card";

                // Image
                if (item.image) {
                    const image = document.createElement("img");
                    image.className = "item-image";
                    image.src = item.image;
                    image.alt = item.name || "Found item";
                    image.loading = "lazy";

                    image.onerror = () => {
                        const placeholder = document.createElement("div");
                        placeholder.className =
                            "item-image item-placeholder";
                        placeholder.textContent = "Item photo";
                        image.replaceWith(placeholder);
                    };

                    card.appendChild(image);
                } else {
                    const placeholder = document.createElement("div");
                    placeholder.className =
                        "item-image item-placeholder";
                    placeholder.textContent = "Item photo";
                    card.appendChild(placeholder);
                }

                // Item details
                const details = document.createElement("div");
                details.className = "item-details";

                const category = document.createElement("span");
                category.className = "item-category";
                category.textContent = item.category || "Other";

                const name = document.createElement("h3");
                name.textContent = item.name || "Unnamed item";

                const date = document.createElement("p");
                date.textContent =
                    `Found: ${item.dateFound || "Unknown"}`;

                const location = document.createElement("p");
                location.textContent =
                    `Where: ${item.location || "Unknown"}`;

                const id = document.createElement("p");
                id.textContent = `ID: #${item.id ?? "N/A"}`;

                const claim = document.createElement("a");
                claim.className = "claim-button";
                claim.href =
                    `instructions.html?item=${encodeURIComponent(item.id ?? "")}`;
                claim.textContent = "Claim this item";

                details.append(
                    category,
                    name,
                    date,
                    location,
                    id,
                    claim
                );

                card.appendChild(details);
                itemsGrid.appendChild(card);
            });

            displayPagination();
        }

        // Page buttons
        function displayPagination() {
            pagination.innerHTML = "";

            const totalPages = Math.ceil(
                filteredItems.length / itemsPerPage
            );

            if (totalPages <= 1) return;

            function addButton(text, page, disabled = false) {
                const button = document.createElement("button");

                button.textContent = text;
                button.disabled = disabled;

                if (page === currentPage && !disabled) {
                    button.classList.add("active");
                }

                button.addEventListener("click", () => {
                    currentPage = page;
                    displayItems();
                });

                pagination.appendChild(button);
            }

            addButton("<", currentPage - 1, currentPage === 1);

            for (let page = 1; page <= totalPages; page++) {
                addButton(page, page);
            }

            addButton(
                ">",
                currentPage + 1,
                currentPage === totalPages
            );
        }

        // Event listeners
        document.getElementById("applyFilters")
            .addEventListener("click", applyFilters);

        searchInput.addEventListener("input", applyFilters);
        sortSelect.addEventListener("change", applyFilters);

        document.getElementById("clearFilters")
            .addEventListener("click", () => {
                searchInput.value = "";
                locationFilter.value = "";
                dateAfter.value = "";
                dateBefore.value = "";
                sortSelect.value = "newest";

                categoryFilters.querySelectorAll("input")
                    .forEach(checkbox => {
                        checkbox.checked = false;
                    });

                applyFilters();
            });

        // Start
        loadItems();
    </script>

</body>
</html>
