<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Found Items | Lost & Found</title>
    <link rel="stylesheet" href="Styles/found.css" />
    <script src="Scripts/found.js" defer></script>

</head>

<body>

    <!-- Header -->
  <header>
    <div class="container inner">
      <a class="brand" href="index.html" aria-label="Lost and Found home">
        <span class="brand-mark" aria-hidden="true"></span>
        <span><span class="site-name">Dastardly Dinos</span> Lost & Found</span>
      </a>

      <button class="menu-toggle" id="menuToggle"
        aria-label="Toggle navigation" aria-expanded="false"
        aria-controls="mainNav">
        <span></span><span></span><span></span>
      </button>
      <nav class="main-nav" id="mainNav" aria-label="Main navigation">
        <a href="index.html">Home</a>
        <a href="report.html">Report Lost Item</a>
        <a class="active" href="found.html">Found Items</a>
        <a href="instructions.html">How to Claim</a>
        <a href="#footer">About / Contact / FAQ</a>
      </nav>
    </div>
  </header>

    <!-- Main content -->
    <main class="container">

        <div class="page-heading">
            <h1>Found items</h1>
            <div class="heading-line"></div>
        </div>

        <div class="found-layout">

            <!-- Filters -->
            <aside class="filters">

                <div class="filter-heading">
                    <h2>Filters</h2>
                    <button id="clearFilters" type="button">
                        Clear all
                    </button>
                </div>

                <h3>Category</h3>

                <div id="categoryFilters"></div>

                <label for="locationFilter">
                    Location found
                </label>

                <select id="locationFilter">
                    <option value="">Any location</option>
                </select>

                <label for="dateAfter">Found after</label>
                <input type="date" id="dateAfter">

                <label for="dateBefore">Found before</label>
                <input type="date" id="dateBefore">

                <button id="applyFilters" class="apply-button" type="button">
                    Apply filters
                </button>

            </aside>

            <!-- Results -->
            <section class="results">

                <div class="search-row">

                    <input type="search" id="searchInput" placeholder="Search found items"
                        aria-label="Search found items">

                    <label for="sortSelect">Sort by</label>

                    <select id="sortSelect">
                        <option value="newest">Newest first</option>
                        <option value="oldest">Oldest first</option>
                        <option value="az">Name A-Z</option>
                        <option value="za">Name Z-A</option>
                    </select>

                </div>

                <p id="itemCount" aria-live="polite">
                    Loading items...
                </p>

                <div id="itemsGrid" class="items-grid"></div>

                <div id="pagination" class="pagination"></div>

                <div class="report-banner">
                    <p>Don't see your item?</p>
                    <a href="report.html">
                        Report a lost item
                    </a>
                </div>

            </section>

        </div>
    </main>

    <!-- Footer -->
<footer id="footer">
    <p>&copy; <span id="currentYear"></span> Dastardly Dinos</p>

    <nav aria-label="Footer navigation">
        <a href="instructions.html">Contact</a>
        <a href="instructions.html">FAQ</a>
        <a href="instructions.html">Claim policy</a>
    </nav>
</footer>

</body>

</html>
